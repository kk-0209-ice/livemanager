<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="ライブ・チケット・座席・特典会・チェキ・推し活費用をまとめて管理するライブ管理アプリ" />
  <title>Live Manager v6.0</title>
  <link rel="manifest" href="./manifest.json?v=6.0" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./app.css?v=6.0" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">LIVE / CHEKI MANAGER</p>
        <h1 id="pageTitle">ホーム</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="quickAddBtn" aria-label="追加">＋</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>ホーム</small></button>
      <button data-route="lives" class="nav-item"><span>🎫</span><small>ライブ</small></button>
      <button data-action="quick-add" class="nav-item nav-add"><span>＋</span><small>追加</small></button>
      <button data-route="cheki-hub" class="nav-item"><span>📸</span><small>チェキ</small></button>
      <button data-route="more" class="nav-item"><span>•••</span><small>その他</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet">
      <header class="modal-header">
        <h2 id="modalTitle">追加</h2>
        <button class="icon-btn ghost" data-close-modal aria-label="閉じる">×</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="./cheki-scanner.js?v=6.0"></script>
  <script src="./app.js?v=6.0"></script>
</body>
</html>
